network:
  renderer: NetworkManager
  ethernets:
    eth0:
      link-local: []
      dhcp4: true
      optional: true
    version: 2
  wifis:
    wlan0:
      link-local: []
      dhcp4: true
      optional: true
      access-points:
        "wifiap":
          auth:
            key-management: psk
            password: "password"
          mode: ap
          band: 2.4GHz